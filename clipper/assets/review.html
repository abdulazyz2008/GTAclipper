<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip review</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --line: #dfe2e8; --text: #15181d; --muted: #667080;
  --accent: #2f6df6; --good: #14874a; --bad: #c2362f; --chip: #eceff4; --focus: #2f6df633;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --panel: #1a1d23; --line: #2c313a; --text: #eceef2; --muted: #98a1b0;
          --accent: #6f9bff; --good: #42c07c; --bad: #f0706a; --chip: #262b33; --focus: #6f9bff40; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
         border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 999px;
       padding: 5px 12px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab b { font-weight: 650; margin-left: 4px; }
.keys { margin-left: auto; color: var(--muted); font-size: 13px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); }
main { display: grid; grid-template-columns: 300px minmax(260px, 400px) minmax(300px, 1fr);
       gap: 16px; padding: 16px; height: calc(100% - 54px); }
.list { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.item { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 8px 10px; width: 100%;
        text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent;
        cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item[aria-current="true"] { background: var(--focus); }
.item img, .item .ph { width: 54px; height: 96px; object-fit: cover; border-radius: 6px;
                       background: var(--chip); display: block; }
.item .t { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box;
           -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { color: var(--muted); font-size: 13px; margin-top: 2px; }
.empty { padding: 24px 16px; color: var(--muted); }
.player { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0; }
video { width: 100%; max-height: calc(100vh - 160px); aspect-ratio: 9 / 16; background: #000;
        border-radius: 12px; }
.nav { display: flex; gap: 8px; }
.side { overflow: auto; background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 16px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=number], textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); }
input:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.count { float: right; font-variant-numeric: tabular-nums; }
.count.over { color: var(--bad); font-weight: 650; }
.trim { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trim .row { display: flex; gap: 4px; }
.trim button { padding: 0 9px; }
.btn { border: 1px solid var(--line); background: var(--chip); border-radius: 8px;
       padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ok { background: var(--good); border-color: var(--good); color: #fff; }
.btn.no { background: transparent; border-color: var(--bad); color: var(--bad); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px;
        font-variant-numeric: tabular-nums; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
     margin: 20px 0 6px; }
.quote { margin: 0; overflow-wrap: anywhere; }
.chat { margin: 0; padding: 0; list-style: none; display: flex; gap: 6px; flex-wrap: wrap; }
#msg { min-height: 20px; margin-top: 10px; font-size: 14px; }
#msg.err { color: var(--bad); }
#msg.fine { color: var(--good); }
@media (max-width: 980px) {
  main { grid-template-columns: 1fr; height: auto; }
  .list { max-height: 240px; }
  video { max-height: 70vh; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Clip review</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="keys"><kbd>A</kbd> approve &nbsp; <kbd>R</kbd> reject &nbsp; <kbd>J</kbd>/<kbd>K</kbd> next / previous &nbsp; <kbd>Space</kbd> play</div>
</header>
<main>
  <div class="list" id="list" aria-label="Clips"></div>
  <div class="player">
    <video id="video" controls playsinline loop></video>
    <div class="nav">
      <button class="btn" id="prev">Previous</button>
      <button class="btn" id="next">Next</button>
    </div>
  </div>
  <div class="side" id="side" hidden>
    <div class="meta" id="meta"></div>
    <label for="hook">Hook (on-screen title) <span class="count" id="hookCount"></span></label>
    <input type="text" id="hook" maxlength="120" autocomplete="off">
    <label for="title">Title (used when publishing) <span class="count" id="titleCount"></span></label>
    <input type="text" id="title" maxlength="100" autocomplete="off">
    <div class="trim">
      <div>
        <label for="start">Start (seconds into stream)</label>
        <div class="row"><button class="btn" data-nudge="start:-0.5" aria-label="Start half a second earlier">&minus;</button>
          <input type="number" id="start" step="0.1" min="0">
          <button class="btn" data-nudge="start:0.5" aria-label="Start half a second later">+</button></div>
      </div>
      <div>
        <label for="end">End</label>
        <div class="row"><button class="btn" data-nudge="end:-0.5" aria-label="End half a second earlier">&minus;</button>
          <input type="number" id="end" step="0.1" min="0">
          <button class="btn" data-nudge="end:0.5" aria-label="End half a second later">+</button></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ok" id="approve">Approve</button>
      <button class="btn no" id="reject">Reject</button>
      <button class="btn" id="save">Save changes</button>
      <button class="btn" id="undo" hidden>Back to review</button>
    </div>
    <div id="msg" role="status"></div>
    <h2>Why it was picked</h2>
    <p class="quote" id="reason"></p>
    <h2>Streamer said</h2>
    <p class="quote" id="transcript"></p>
    <h2>Chat said</h2>
    <ul class="chat" id="chat"></ul>
  </div>
</main>
<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
const TABS = [["rendered", "To review"], ["approved", "Approved"], ["rejected", "Rejected"], ["uploaded", "Uploaded"]];
const $ = (id) => document.getElementById(id);
let state = { clips: [], counts: {} }, tab = "rendered", current = null, busy = false;

async function api(path, body) {
  const opt = { headers: { "X-Clipper-Key": KEY } };
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({ error: "bad reply from the review server" }));
  if (!r.ok) throw new Error(data.error || ("request failed: " + r.status));
  return data;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function clock(t) { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function shown() { return state.clips.filter(c => c.status === tab); }
function say(text, kind) { const m = $("msg"); m.textContent = text || ""; m.className = kind || ""; }

function drawTabs() {
  const box = $("tabs"); box.textContent = "";
  for (const [id, name] of TABS) {
    const b = el("button", "tab"); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", id === tab);
    b.append(name, el("b", null, state.counts[id] || 0));
    b.onclick = () => { tab = id; current = null; draw(); };
    box.append(b);
  }
}
function drawList() {
  const box = $("list"); box.textContent = "";
  const clips = shown();
  if (!clips.length) {
    box.append(el("div", "empty", tab === "rendered"
      ? "Nothing waiting. Run `clipper run` or `clipper watch` to make clips." : "Nothing here yet."));
    return;
  }
  for (const c of clips) {
    const b = el("button", "item"); b.setAttribute("aria-current", current && c.id === current.id);
    if (c.has_thumb) { const i = el("img"); i.alt = ""; i.loading = "lazy"; i.src = `/thumb/${c.id}.jpg?k=${KEY}&v=${c.version}`; b.append(i); }
    else b.append(el("div", "ph"));
    const d = el("div");
    d.append(el("div", "t", c.title || "(no title)"), el("div", "m", `#${c.id} · ${c.streamer} · score ${Math.round(c.llm_score)} · ${Math.round(c.end - c.start)}s`));
    b.append(d); b.onclick = () => pick(c.id); box.append(b);
  }
}
function drawSide() {
  const c = current, side = $("side");
  side.hidden = !c;
  const v = $("video");
  if (!c) { v.removeAttribute("src"); v.load(); return; }
  const src = `/media/${c.id}.mp4?k=${KEY}&v=${c.version}`;
  if (v.dataset.src !== src) { v.dataset.src = src; v.src = c.has_file ? src : ""; if (c.has_file) v.play().catch(() => {}); }
  const meta = $("meta"); meta.textContent = "";
  for (const t of [`#${c.id}`, c.streamer, `at ${clock(c.start)}`, `${Math.round(c.end - c.start)}s`, `score ${Math.round(c.llm_score)}`,
                   `chat ${c.chat_score.toFixed(1)}`, `acceleration ${c.accel_score.toFixed(1)}`, `audio ${c.audio_score.toFixed(1)}`])
    meta.append(el("span", "chip", t));
  $("hook").value = c.hook; $("title").value = c.title; $("start").value = c.start; $("end").value = c.end;
  $("reason").textContent = c.reason || "—";
  $("transcript").textContent = c.transcript || "No speech-to-text for this clip.";
  const chat = $("chat"); chat.textContent = "";
  if (c.chat_sample.length) for (const m of c.chat_sample) chat.append(el("li", "chip", m));
  else chat.append(el("li", null, "No chat for this clip."));
  const locked = c.status === "uploaded";
  for (const id of ["hook", "title", "start", "end", "approve", "reject", "save"]) $(id).disabled = locked || busy;
  document.querySelectorAll("[data-nudge]").forEach(b => b.disabled = locked || busy);
  $("approve").hidden = c.status === "approved" || locked;
  $("reject").hidden = c.status === "rejected" || locked;
  $("undo").hidden = !(c.status === "approved" || c.status === "rejected");
  $("undo").disabled = busy;
  counts();
}
function counts() {
  for (const [id, max] of [["hook", 60], ["title", 95]]) {
    const n = $(id).value.length, e = $(id + "Count");
    e.textContent = `${n}/${max}`; e.className = "count" + (n > max ? " over" : "");
  }
}
function draw() {
  const clips = shown();
  if (!current || !clips.some(c => c.id === current.id)) current = clips[0] || null;
  else current = clips.find(c => c.id === current.id);
  drawTabs(); drawList(); drawSide();
}
function pick(id) { current = state.clips.find(c => c.id === id) || null; say(""); draw(); }
function step(d) { const clips = shown(); if (!clips.length) return;
  const i = Math.max(0, clips.findIndex(c => current && c.id === current.id));
  pick(clips[Math.min(clips.length - 1, Math.max(0, i + d))].id); }
async function load() { state = await api("/api/state"); draw(); }

async function send(status) {
  if (!current || busy) return;
  const c = current, body = {};
  const hook = $("hook").value.trim(), title = $("title").value.trim();
  const start = parseFloat($("start").value), end = parseFloat($("end").value);
  if (hook !== c.hook) body.hook = hook;
  if (title !== c.title) body.title = title;
  if (!Number.isNaN(start) && Math.abs(start - c.start) > 0.004) body.start = start;
  if (!Number.isNaN(end) && Math.abs(end - c.end) > 0.004) body.end = end;
  if (status) body.status = status;
  if (!Object.keys(body).length) { say("Nothing to save."); return; }
  const rerender = "hook" in body || "start" in body || "end" in body;
  busy = true; drawSide();
  say(rerender ? "Rendering the clip again… this takes a little while." : "Saving…");
  try {
    const clips = shown(), i = clips.findIndex(x => x.id === c.id);
    const nextId = status && clips[i + 1] ? clips[i + 1].id : (status && clips[i - 1] ? clips[i - 1].id : c.id);
    await api(`/api/clip/${c.id}`, body);
    busy = false;
    state = await api("/api/state");
    current = state.clips.find(x => x.id === (status ? nextId : c.id)) || null;
    draw();
    say(status === "approved" ? `Approved #${c.id}.` : status === "rejected" ? `Rejected #${c.id}.`
        : status === "rendered" ? `Moved #${c.id} back to review.` : "Saved.", "fine");
  } catch (e) { busy = false; drawSide(); say(e.message, "err"); }
}

$("approve").onclick = () => send("approved");
$("reject").onclick = () => send("rejected");
$("save").onclick = () => send(null);
$("undo").onclick = () => send("rendered");
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("hook").oninput = counts; $("title").oninput = counts;
document.querySelectorAll("[data-nudge]").forEach(b => b.onclick = () => {
  const [id, d] = b.dataset.nudge.split(":"); const f = $(id);
  f.value = Math.max(0, Math.round((parseFloat(f.value || 0) + parseFloat(d)) * 100) / 100);
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "a" && current && current.status !== "approved" && current.status !== "uploaded") send("approved");
  else if (k === "r" && current && current.status !== "rejected" && current.status !== "uploaded") send("rejected");
  else if (k === "j" || k === "arrowdown") { e.preventDefault(); step(1); }
  else if (k === "k" || k === "arrowup") { e.preventDefault(); step(-1); }
  else if (k === " " && !e.target.matches("button, video")) { e.preventDefault(); const v = $("video"); v.paused ? v.play() : v.pause(); }
});
load().catch(e => { $("list").append(el("div", "empty", "Could not load clips: " + e.message)); });
function dirty() {
  const c = current; if (!c) return false;
  return $("hook").value.trim() !== c.hook || $("title").value.trim() !== c.title
    || Math.abs(parseFloat($("start").value) - c.start) > 0.004 || Math.abs(parseFloat($("end").value) - c.end) > 0.004;
}
// pick up clips made in the background (live watcher), without discarding unsaved edits
setInterval(() => { if (!busy && !dirty()) load().catch(() => {}); }, 15000);
</script>
</body>
</html>
